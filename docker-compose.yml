# ══════════════════════════════════════════════════════════════════
#  E-Test System — Local Development Stack
#  Run with: docker compose up --build
#
#  Services:
#    postgres  → PostgreSQL 15 database (port 5435 on host)
#    server    → Express API server     (port 5000 on host)
#    client    → React/Vite SPA         (port 80 on host → http://localhost)
# ══════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL Database ────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: exam_app_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exam_app
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - exam_network

  # ── Auto-Seeder (runs once on startup, loads schema + demo data) ──
  seeder:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: exam_app_seeder
    # Runs schema.sql which contains DROP/CREATE + all INSERT demo data.
    # restartPolicy: on-failure ensures it retries if postgres isn't ready yet.
    restart: on-failure
    command: ["node", "src/db/seed.js"]
    environment:
      DB_MODE: docker_pg
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/exam_app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - exam_network

  # ── Express API Server ─────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: exam_app_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_MODE: docker_pg
      # Internal Docker network address — 'postgres' resolves to the postgres container
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/exam_app
      JWT_SECRET: local-dev-secret
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    networks:
      - exam_network

  # ── React Frontend (Nginx) ─────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Baked into the Vite bundle at build time
        VITE_API_URL: http://localhost:5000/api
    container_name: exam_app_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - exam_network

  # ── Startup Helper (Prints URLs) ───────────────────────────────
  welcome:
    image: alpine
    container_name: exam_app_welcome
    depends_on:
      client:
        condition: service_started
      server:
        condition: service_started
    command: >
      sh -c "sleep 5 && echo '' && echo '==================================================' && echo '✅ E-Test System is running successfully!' && echo '' && echo '🌐 Frontend:' && echo 'http://localhost' && echo '' && echo '🔗 API Health Check:' && echo 'http://localhost:5000/api/status' && echo '' && echo '🔑 Demo Login:' && echo 'Teacher: teacher1 / 123444' && echo 'Student: student1 / 1789' && echo '=================================================='"

# ── Shared Resources ───────────────────────────────────────────
volumes:
  postgres_data:

networks:
  exam_network:
    driver: bridge
